<!doctype html>
<html lang="<!-- HTML_LANG -->">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta name="referrer" content="origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- Default matches LIGHT_THEME.variables.background in ThemeManager.
         Android Chrome uses this for the installed PWA status bar; without
         it, Chrome falls back to the manifest's theme_color. The inline
         script below and ThemeManager update `content` to the active
         theme's --sb-background so the bar follows light/dark (and custom
         background colors) instead of the OS prefers-color-scheme. -->
    <meta name="theme-color" id="sb-theme-color" content="#f8fafc" />
    <link rel="icon" href="/standalone/img/favicon.ico" />
    <link rel="apple-touch-icon" href="/standalone/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://assets.seedbible.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://vmfnri.helloao.org" />
    <link rel="dns-prefetch" href="https://i.seedbible.org" />
    <link rel="dns-prefetch" href="https://auth.seedbible.org" />
    <meta property="og:type" content="website" />
    <!-- `content` is rewritten at build time to the emitted asset's absolute
         URL — see script/lib/vite-plugin-html-meta-assets.ts. -->
    <meta
      property="og:image"
      content="/standalone/img/SeedBibleLogoBlackOnWhiteBackground.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Seed Bible Logo" />
    <style>
      html {
        visibility: hidden;
        opacity: 0;
      }
      body {
        margin: 0;
      }
    </style>
    <!-- Inlined by script/lib/vite-plugin-inline-critical-css.ts at build
         time from the *.inline.css files (base + BibleReader +
         BibleReaderToolbar) — must come after the hidden-by-default rule
         above so its `html { visibility: visible }` rule wins the cascade
         without waiting on the external stylesheet. In dev this is never
         replaced (build-only plugin), so it stays an empty, harmless tag. -->
    <style id="sb-critical-styles">
      <!-- CRITICAL_STYLE_TAG -->
    </style>
    <style id="sb-theme-styles">
      <!-- THEME_STYLE_TAG -->
    </style>
    <script type="application/json" id="sb-theme-presets">
      <!-- THEME_PRESETS_JSON -->
    </script>
    <script>
      // Applies the device's real saved theme (or System, the default, when
      // nothing is saved) before any JS bundle loads —
      // reads localStorage directly rather than going through the app's own
      // managers, since those don't run until much later. Corrects the
      // #sb-theme-styles tag the server rendered (see entry-ssr.tsx), which
      // reflects the server's default-light guess, not this device's saved
      // preference. See ThemeManager.tsx / CLAUDE.md for why this stays
      // `body`-scoped.
      (function () {
        try {
          var raw = localStorage.getItem("sb-profile-config-local");
          var params = new URLSearchParams(window.location.search);
          var embed = (params.get("embed") || "").toLowerCase();
          var linkTheme =
            embed === "minimal" || embed === "true"
              ? params.get("app.themeId")
              : null;
          var themeId =
            (linkTheme && linkTheme.trim()) ||
            (raw && JSON.parse(raw).themeId) ||
            "system";
          if (themeId === "system") {
            themeId = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          var presetsEl = document.getElementById("sb-theme-presets");
          if (!presetsEl || !presetsEl.textContent) return;
          var css = JSON.parse(presetsEl.textContent)[themeId];
          if (!css) return;
          var tag = document.getElementById("sb-theme-styles");
          if (tag) tag.textContent = css;
          var bg = /--sb-background:\s*([^;]+)/.exec(css);
          var themeColor =
            document.getElementById("sb-theme-color") ||
            document.querySelector('meta[name="theme-color"]');
          if (bg && themeColor)
            themeColor.setAttribute("content", bg[1].trim());
        } catch (e) {
          // Corrupt/inaccessible storage — keep the server's default.
        }
      })();
    </script>
    <script>
      // Applies the device's saved reader settings (UI size, reader font
      // size, scripture width, verse line height) before first paint. The
      // app seeds its settings with the defaults so hydration matches the
      // server's HTML, then applies the saved ones after mount, which used
      // to resize and reflow the chapter on every visit. These are CSS
      // variables and one attribute on <html>, which hydration never
      // touches; SettingsManager takes over once the real settings load
      // (see EARLY_CONFIG_ATTR). Links with `app.*` overrides are skipped,
      // since those win over saved settings.
      //
      // The values come from the copy SettingsManager keeps of just these
      // four settings (it is written signed in or out), falling back to the
      // anonymous local config, which is emptied as soon as someone signs in.
      (function () {
        try {
          if (/[?&]app\./.test(window.location.search)) return;
          var read = function (key, maxLength) {
            var raw = localStorage.getItem(key);
            if (!raw || raw.length > maxLength) return null;
            var parsed = JSON.parse(raw);
            return parsed && typeof parsed === "object" ? parsed : null;
          };
          var saved = null;
          try {
            saved = read("sb-reader-settings-early", 2000);
          } catch (e) {}
          var legacy = null;
          if (!saved) {
            // Signed-in readers on a device that has not written the copy
            // yet (it predates it, or this is the first visit since): the
            // profile LoginManager cached on the last visit holds the same
            // settings under `config`. A brand-new device has neither, so a
            // signed-in reader there still waits for the profile.
            try {
              for (var i = 0; i < localStorage.length && !legacy; i++) {
                var key = localStorage.key(i);
                if (key && key.indexOf("sb-profile-cache-") === 0) {
                  var cached = read(key, 500000);
                  if (
                    cached &&
                    cached.config &&
                    typeof cached.config === "object"
                  ) {
                    legacy = cached.config;
                  }
                }
              }
            } catch (e) {}
          }
          if (!saved && !legacy) {
            // Same limits as LoginManager's readLocalConfig (50,000
            // characters, 100 keys); past them the app treats the store as
            // corrupt, so painting from it would only be undone.
            legacy = read("sb-profile-config-local", 50000);
            if (legacy && Object.keys(legacy).length > 100) legacy = null;
          }
          var config = saved || legacy;
          if (!config) return;
          // Line height has its own key now; older configs only kept it
          // inside the removed per-section `textConfig`.
          var lineHeight = config.verseLineHeight;
          if (legacy && lineHeight == null) {
            try {
              var text = config.textConfig;
              if (typeof text === "string") text = JSON.parse(text);
              lineHeight = text && text.verse && text.verse.lineHeight;
            } catch (e) {}
          }
          var root = document.documentElement;
          var applied = false;
          var apply = function (name, value) {
            root.style.setProperty(name, value);
            applied = true;
          };
          var uiScales = { S: 0.85, M: 1, L: 1.15, XL: 1.3 };
          var fontSizes = { XS: 12, S: 14, M: 16, L: 18, XL: 20, XXL: 22 };
          if (uiScales.hasOwnProperty(config.uiSize)) {
            apply("--sb-ui-scale", String(uiScales[config.uiSize]));
          }
          if (fontSizes.hasOwnProperty(config.fontSize)) {
            apply("--sb-early-font-size", fontSizes[config.fontSize] + "px");
          }
          var width = Number(config.scriptureWidth);
          if (isFinite(width) && width >= 24 && width <= 192) {
            apply("--sb-scripture-width", width + "ch");
          }
          lineHeight = Number(lineHeight);
          if (isFinite(lineHeight) && lineHeight > 0 && lineHeight < 10) {
            apply("--text-verse-line-height", String(lineHeight));
          }
          // Any applied value means SettingsManager must not write its
          // defaults over it on the way to the real settings.
          if (applied) root.setAttribute("data-sb-early-config", "");
        } catch (e) {
          // Corrupt/inaccessible storage — the defaults stand.
        }
      })();
    </script>
    <!-- The reading font's latin file (27 KB; Google serves it from a
         versioned, immutable URL), fetched alongside the stylesheet that names
         it instead of after it, so on a decent connection it is in before the
         first layout and the chapter never re-wraps. If Google ever moves the
         file this 404s harmlessly and the calibrated fallback face carries
         the first paint, as it does on a slow connection. Newsreader's
         132 KB file is deliberately not preloaded; it only sets titles. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="https://fonts.gstatic.com/s/plusjakartasans/v12/LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko20yygg_vb.woff2"
    />
    <!-- Fonts load without blocking first paint. The two stylesheets below
         are rewritten at build time into non-blocking preloads (see
         script/lib/inlineCriticalCss.ts); the icon stylesheet is written out
         by hand because it also lifts the `sb-icons-pending` class that keeps
         icon names hidden until the font is there. The hrefs must match
         STATIC_FONT_STYLESHEETS in app/fontStylesheets.ts (a test checks). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto&family=Open+Sans&family=Playfair+Display&family=Cormorant+Garamond&display=swap"
    />
    <script>
      (function () {
        var root = document.documentElement;
        var clear = function () {
          root.classList.remove("sb-icons-pending");
        };
        root.classList.add("sb-icons-pending");
        // Called once the icon stylesheet is in; the icons stay hidden until
        // the font file itself has arrived, since until then the (invisible)
        // glyph names would still take up their full width.
        window.__sbIconsStylesheetReady = function () {
          if (!document.fonts || !document.fonts.load) return clear();
          var tries = 0;
          (function check() {
            // Resolves with no faces until the stylesheet's @font-face is
            // registered, so an empty answer means "not yet", not "done".
            document.fonts
              .load("24px 'Material Symbols Outlined'", "a")
              .then(function (faces) {
                if (faces.length || ++tries > 20) clear();
                else window.setTimeout(check, 100);
              }, clear);
          })();
        };
        // Never leave icons invisible if the font can't be fetched.
        window.setTimeout(clear, 4000);
      })();
    </script>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
        window.__sbIconsStylesheetReady();
      "
      onerror="document.documentElement.classList.remove('sb-icons-pending')"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      />
    </noscript>
    <!-- META -->
    <script type="application/json" id="app-config">
      <!-- CONFIG_JSON -->
    </script>
    <script type="application/json" id="app-seed-data">
      <!-- SEED_JSON -->
    </script>
    <script type="application/json" id="app-customization-seed">
      <!-- CUSTOMIZATION_JSON -->
    </script>
    <script type="application/json" id="app-playlist-page-seed">
      <!-- PLAYLIST_PAGE_JSON -->
    </script>
    <script type="application/json" id="app-reading-plan-page-seed">
      <!-- READING_PLAN_PAGE_JSON -->
    </script>
  </head>
  <body>
    <div id="app">
      <!-- APP_HTML -->
    </div>
    <script type="module" src="/standalone/index.tsx"></script>
  </body>
</html>
