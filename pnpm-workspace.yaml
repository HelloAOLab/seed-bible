packages:
  - "packages/*"
allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false
  "puppeteer": true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1000.6"
  - "@aws-sdk/client-s3@3.1069.0"
  - "@aws-sdk/core@3.974.21"
  - "@aws-sdk/credential-provider-env@3.972.47"
  - "@aws-sdk/credential-provider-http@3.972.49"
  - "@aws-sdk/credential-provider-ini@3.972.54"
  - "@aws-sdk/credential-provider-login@3.972.53"
  - "@aws-sdk/credential-provider-node@3.972.56"
  - "@aws-sdk/credential-provider-process@3.972.47"
  - "@aws-sdk/credential-provider-sso@3.972.53"
  - "@aws-sdk/credential-provider-web-identity@3.972.53"
  - "@aws-sdk/middleware-flexible-checksums@3.974.31"
  - "@aws-sdk/middleware-sdk-s3@3.972.52"
  - "@aws-sdk/nested-clients@3.997.21"
  - "@aws-sdk/signature-v4-multi-region@3.996.35"
  - "@aws-sdk/token-providers@3.1069.0"
  - "@aws-sdk/types@3.973.13"
  - "@aws-sdk/xml-builder@3.972.30"
  - "@casual-simulation/aux-common@4.2.8-alpha.38630400059"
  - "@casual-simulation/aux-records@4.2.8-alpha.38630400059"
  - "@casual-simulation/aux-runtime@4.2.8-alpha.38630400059"
  - "@casual-simulation/aux-vm@4.2.8-alpha.38630400059"
  - "@casual-simulation/aux-websocket@4.2.8-alpha.38630400059"
patchedDependencies:
  "@casual-simulation/aux-records@4.2.8-alpha.38630400059": patches/@casual-simulation__aux-records@4.2.8-alpha.38630400059.patch
  "@casual-simulation/fast-json-stable-stringify": "patches/@casual-simulation__fast-json-stable-stringify.patch"
  "follow-redirects": "patches/follow-redirects.patch"
catalog:
  i18next: "26.2.0"
  i18next-resources-to-backend: "^1.2.1"
  preact: "10.29.8"
  preact-iso: "^2.12.0"
  react: "npm:@preact/compat@^18.3.2"
  react-dom: "npm:@preact/compat@^18.3.2"
  zod: "4.6.7"
  axios: "1.21.0"
  "@casual-simulation/aux-common": "4.2.8-alpha.38630400059"
  "@casual-simulation/aux-websocket": "4.2.8-alpha.38630400059"
  "@casual-simulation/websocket": "4.0.0"
  typesense: "^3.0.5"
  base64-js: "1.5.1"
  uuid: "^13.0.2"
  preact-render-to-string: "^6.7.0"
  rxjs: "8.0.0-alpha.14"
  luxon: "^3.7.2"
  dompurify: "^3.4.17"
  qrcode: "^1.5.4"
  "@tiptap/core": "3.32.2"
  "@tiptap/pm": "3.32.2"
  "@tiptap/extension-bullet-list": "3.32.2"
  "@tiptap/extension-color": "3.32.2"
  "@tiptap/extension-highlight": "3.32.2"
  "@tiptap/extension-image": "3.32.2"
  "@tiptap/extension-link": "3.32.2"
  "@tiptap/extension-list-item": "3.32.2"
  "@tiptap/extension-ordered-list": "3.32.2"
  "@tiptap/extension-subscript": "3.32.2"
  "@tiptap/extension-superscript": "3.32.2"
  "@tiptap/extension-text-align": "3.32.2"
  "@tiptap/extension-text-style": "3.32.2"
  "@tiptap/extension-underline": "3.32.2"
  "@tiptap/starter-kit": "3.32.2"
  "prosemirror-model": "1.25.12"
  "prosemirror-transform": "1.12.4"
  "prosemirror-view": "1.42.9"
  # The prosemirror packages and zod each resolved to two versions, so the bundle
  # carried both copies (prosemirror-view alone cost 94 KB twice over). Vite's
  # `resolve.dedupe` cannot fix this: it resolves to the copy in the project root
  # `node_modules`, and pnpm does not hoist transitive dependencies there. Pinning
  # via `overrides` is what actually collapses them.
  "@types/json-schema": "7.0.15"
overrides:
  "prosemirror-model": "catalog:"
  "prosemirror-transform": "catalog:"
  "prosemirror-view": "catalog:"
  # @casual-simulation/aux-common's @anthropic-ai/sdk pulled zod 4.1.12 next to
  # the app's 4.6.7. Both are zod 4.x, so one copy serves both.
  "zod": "catalog:"
  # Security fixes for transitive dependencies whose parents haven't picked up
  # the patched release yet. Each selector only matches the vulnerable range and
  # moves it to the patched version in the same major, so no API changes.
  "axios@<1.21.0": "^1.21.0"
  "ajv@>=6 <6.14.0": "^6.14.0"
  "ajv@>=8 <8.18.0": "^8.18.0"
  "brace-expansion@>=1 <1.1.21": "^1.1.21"
  "brace-expansion@>=2 <2.1.7": "^2.1.7"
  "brace-expansion@>=5 <5.0.12": "^5.0.12"
  "fast-uri@>=3 <3.1.9": "^3.1.9"
  "flatted@>=3 <3.4.2": "^3.4.2"
  "@humanfs/node@<0.16.8": "^0.16.8"
  "js-yaml@>=4 <4.3.2": "^4.3.2"
  "minimatch@<3.1.5": "^3.1.5"
  "minimatch@>=9 <9.0.9": "^9.0.9"
  "picomatch@>=4 <4.0.4": "^4.0.4"
  "protobufjs@>=7 <7.6.5": "^7.6.5"
  "@protobufjs/utf8@<1.1.1": "^1.1.1"
  "simple-git@>=3 <3.36.0": "^3.36.0"
  "source-map-js@<1.2.2": "^1.2.2"
  "undici@>=7 <7.30.1": "^7.30.1"
  "uuid@<11.1.1": "^11.1.1"
  "ws@>=8 <8.21.0": "^8.21.0"
